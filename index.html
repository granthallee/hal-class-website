<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Putting History Before Us - because history matters</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar is-dark">
        <div class="navbar-brand">
            <a class="navbar-item" href="#">
                <strong class="has-text-white">Putting History Before Us</strong>
            </a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero is-primary">
        <div class="hero-body">
            <div class="container has-text-centered">
                <h1 class="title is-1 is-spaced">Putting History Before Us</h1>
                <p class="subtitle is-4">because history matters</p>
            </div>
        </div>
    </section>

    <!-- Main Tabs -->
    <div class="container mt-5">
        <div class="tabs is-centered is-boxed is-large" id="nav">
            <ul>
                <li class="is-active" id="world-tab" data-target="world-history">
                    <a><span class="icon"><i class="fas fa-globe"></i></span><span>World History</span></a>
                </li>
                <li id="us-tab" data-target="us-history">
                    <a><span class="icon"><i class="fas fa-flag-usa"></i></span><span>US History</span></a>
                </li>
            </ul>
        </div>
    </div>

    <!-- Content Container -->
    <div id="content-container" class="container">
        <!-- Dynamically generated -->
    </div>

    <!-- Modal Container -->
    <div id="post-modal" class="modal">
        <div class="modal-background"></div>
        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title" id="modal-title">Post Title</p>
                <button class="delete" aria-label="close" onclick="closeModal()"></button>
            </header>
            <section class="modal-card-body" id="modal-content">
                <!-- Post content loads here -->
            </section>
            <footer class="modal-card-foot">
                <button class="button" onclick="closeModal()">Close</button>
            </footer>
        </div>
    </div>

    <footer class="footer mt-6">
        <div class="content has-text-centered">
            <p><strong>Putting History Before Us</strong> - because history matters. Built with Bulma.</p>
        </div>
    </footer>

    <script src="content/blog-content.js"></script>
    <script src="script.js"></script>
</body>
</html>
